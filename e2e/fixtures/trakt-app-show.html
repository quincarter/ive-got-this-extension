<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <title>Trakt Web: Менталист</title>
  </head>
  <body>
    <!--
      Mirrors app.trakt.tv (November 2026) with the UI in Russian: the year is in the
      summary subtitle (no .year), there are no IMDb/TMDb links, and the "Where to Watch"
      list sits in .trakt-where-to-watch-list with a localized title.
    -->
    <div class="trakt-summary-title">
      <h1 class="trakt-responsive-title">Менталист</h1>
    </div>
    <div class="trakt-summary-subtitle">
      <p class="secondary">2008 • 151 эп. • TV-14 • Драма</p>
    </div>

    <div class="trakt-where-to-watch-list">
      <section class="section-list-container">
        <div class="trakt-list-inset-title">
          <div class="trakt-list-title">
            <span class="title shadow-list-title ellipsis">Где посмотреть</span>
          </div>
        </div>
        <div class="section-list">
          <div class="trakt-list-item-container section-list-horizontal-scroll">
            <div class="trakt-where-to-watch-item">
              <div class="where-to-watch-item-content"><p>Hulu</p></div>
            </div>
          </div>
        </div>
      </section>
    </div>
  </body>
</html>
